[workspace]
resolver = "3"
members = ["crates/*"]
# hfst-c (the C FFI) is out of scope: incomplete, unused, and headed for a
# redesigned API, so it is excluded from the build and must not constrain the
# library's public signatures. See [dec:hfst:hfst-c-out-of-scope]. Revisit as a
# dedicated effort.
exclude = ["crates/hfst-c"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
repository = "https://github.com/divvun/rust-hfst"

# Workspace-wide lints. Each in-scope crate opts in with `[lints] workspace =
# true`. Keep this the single source of truth for shared lint policy.
[workspace.lints.rust]
# No `unsafe` anywhere in the workspace — a hard build error, no per-crate
# override. The library crates are already at zero. Any remaining `unsafe` (the
# hfst-cli C-port `static mut` globals) must be de-globalized into safe threaded
# state, not silenced.
unsafe_code = "forbid"

[workspace.lints.clippy]
# No silent `_` arms on enum matches: a match over an ImplementationType (or any
# enum) must name every variant it handles, so adding a backend/format can never
# fall through to a wrong default. A hard error — the only escape is an explicit
# per-site `#[allow(clippy::wildcard_enum_match_arm)]`, added only when the
# operator authorises it.
wildcard_enum_match_arm = "deny"

[workspace.dependencies]
# internal crates (dependency layers, bottom-up)
hfst-types = { path = "crates/hfst-types" }
hfst-core = { path = "crates/hfst-core" }
hfst-openfst = { path = "crates/hfst-openfst" }
hfst-ol = { path = "crates/hfst-ol" }
hfst = { path = "crates/hfst" }

# weighted-FST backend (git submodule; our fork of rustfst). Missing algos
# (difference/intersect/prune/equivalent/eps-normalize) get added here + upstreamed.
rustfst = { path = "rustfst/rustfst" }

# parser front-ends (sibling repo: text -> AST). The port owns AST -> transducer.
nfst-xre = { path = "../nfst/crates/nfst-xre" }
nfst-lexc = { path = "../nfst/crates/nfst-lexc" }
nfst-pmatch = { path = "../nfst/crates/nfst-pmatch" }
nfst-twolc = { path = "../nfst/crates/nfst-twolc" }
nfst-xfst = { path = "../nfst/crates/nfst-xfst" }
