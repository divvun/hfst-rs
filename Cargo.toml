[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
repository = "https://github.com/divvun/hfst-rs"

# Workspace-wide lints. Each in-scope crate opts in with `[lints] workspace =
# true`. Keep this the single source of truth for shared lint policy.
[workspace.lints.rust]
# No `unsafe` anywhere in the workspace — a hard build error, no per-crate
# override. The library crates are already at zero. Any remaining `unsafe` (the
# hfst-cli C-port `static mut` globals) must be de-globalized into safe threaded
# state, not silenced.
unsafe_code = "forbid"
# Idiom hygiene (edition-independent): elided_lifetimes_in_paths,
# explicit_outlives_requirements, unused_extern_crates, bare_trait_objects.
# Zero violations today; deny keeps it that way. priority -1 so a specific
# lint could still override the group.
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
# The whole default clippy set (correctness/suspicious/style/complexity/perf) is
# at zero across the workspace — `cargo clippy --workspace --all-targets` is
# clean. Deny it so a regression is a hard build error, not a warning that rots
# unnoticed (as `unwrap`/camelCase did before they were gated). priority -1 so
# the specific denies below, and any authorised per-site `#[allow(...)]`, still
# win over the group.
all = { level = "deny", priority = -1 }
# No leftover `todo!()` macros (complements the nplan stub gate).
todo = "deny"
# No silent `_` arms on enum matches: a match over an ImplementationType (or any
# enum) must name every variant it handles, so adding a backend/format can never
# fall through to a wrong default. A hard error — the only escape is an explicit
# per-site `#[allow(clippy::wildcard_enum_match_arm)]`, added only when the
# operator authorises it.
wildcard_enum_match_arm = "deny"

[workspace.dependencies]
# internal crates (dependency layers, bottom-up)
hfst-openfst = { path = "crates/hfst-openfst" }
# default-features = false so a consumer's own backend features are the only
# thing that turn a backend on. Inheriting the library's defaults instead let it
# keep AnyTransducer::Foma while --no-default-features gated away the CLI arms
# matching it, and the CLI stopped compiling without the backend.
hfst = { path = "crates/hfst", default-features = false }

# weighted-FST backend (git submodule; our fork of rustfst). Missing algos
# (difference/intersect/prune/equivalent/eps-normalize) get added here + upstreamed.
rustfst = { git = "https://github.com/necessary-nu/rustfst", branch = "fix/determinize-subset-canonicalization" }

# parser front-ends (sibling repo: text -> AST). The port owns AST -> transducer.
# 0.2 carries htwolcpre1's marker renames for bare 0/#/.#. — required by the
# hfst#334 alphabet validator, which sees a literal "0" without them.
nfst-xre = "0.2.1"
nfst-lexc = "0.2.1"
nfst-pmatch = "0.2.1"
nfst-twolc = "0.2.1"
nfst-xfst = "0.2.1"

