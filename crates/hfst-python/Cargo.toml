[package]
name = "hfst-python"
# The version of divvun-hfst, which is versioned on its own and released from
# a `python/v<version>` tag; the library it binds keeps the workspace version.
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "pyo3 glue behind divvun-hfst, Divvun HFST for Python"
# The glue reaches users only through the divvun-hfst package under python/,
# which maturin builds from this crate.
publish = false

# An extension module leaves the Python symbols for the interpreter, so no
# Rust test binary can link against it: python/tests tests it through Python.
[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
hfst = { workspace = true }
# The compile feature brings the compilers, the algebra and both of its
# backends, foma among them; bhfst adds packing spellers, which needs
# box-format's writer.
hfst-embed = { workspace = true, features = ["bhfst"] }
# The stable ABI from CPython 3.11, so one wheel per platform serves every
# release from 3.11 on. A transducer's methods are spread over a module for
# each kind of call, which needs more than one `#[pymethods]` block.
pyo3 = { version = "0.30", features = ["abi3-py311", "multiple-pymethods"] }
tracing = "0.1.44"

[lints]
workspace = true
