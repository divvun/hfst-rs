[package]
name = "hfst-embed"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "What @divvun/hfst and divvun-hfst read and run: transducers, pmatch tokenisers and DHFST files read from bytes, and lookup, tokenise and acceptor lookup on them"
# It reaches users only through the two packages, whose binding crates build
# it in, so it is never published.
publish = false

[dependencies]
divvun-fst = { workspace = true }
# Without default features, so the read-only surface carries no foma backend.
hfst = { workspace = true }
# The tropical backend's type, which the compile feature names.
hfst-openfst = { workspace = true, optional = true }
tracing = { version = "0.1.44", optional = true }
# A compile keeps what the library says through tracing as diagnostics, with
# a layer on a registry of its own for the length of the compile.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"], optional = true }

[features]
# Compiling, transforming, inspecting and writing transducers of every type
# the library reads, foma included. Off by default, so a binding that only
# reads and runs, as crates/hfst-wasm does, links none of it.
compile = ["hfst/foma", "dep:hfst-openfst", "dep:tracing", "dep:tracing-subscriber"]
# Packing a BHFST speller, with box-format's archive writer and the zhfst
# and index.xml readers. It builds for wasm32-unknown-unknown, as the compile
# feature does, and is a feature of its own so a binding that compiles but
# does not pack spellers links none of it.
bhfst = ["compile", "hfst/bhfst"]

[dev-dependencies]
# The tests build their transducers, tokeniser and DHFST files with the
# library's compilers and writers, which build on the tropical backend. Tests
# run natively, so none of it reaches a package.
hfst-openfst = { workspace = true }

[lints]
workspace = true
