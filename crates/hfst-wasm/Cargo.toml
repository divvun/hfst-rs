[package]
name = "hfst-wasm"
# The version of @divvun/hfst, which is versioned on its own and released from
# a `wasm/v<version>` tag; js/hfst/package.json repeats it, and a test checks
# the two agree. The library it binds keeps the workspace version.
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "wasm-bindgen glue behind @divvun/hfst, Divvun HFST for JavaScript"
publish = false

# The glue reaches users only through the npm package under js/hfst, so the
# crate is never published.
[lib]
crate-type = ["cdylib"]

[features]
# The test hooks of hfst-wasm-shared, in this module. Only
# `js/build.mjs --test` turns it on.
test-hooks = ["hfst-wasm-shared/test-hooks"]

[dependencies]
# Without default features, so the module carries no foma backend.
hfst = { workspace = true }
hfst-embed = { workspace = true }
hfst-wasm-shared = { path = "../hfst-wasm-shared" }
js-sys = "0.3.95"
# The wasm-bindgen CLI that writes the JavaScript glue must be this exact
# version, or it refuses the module.
wasm-bindgen = "=0.2.118"

[dev-dependencies]
# The example that writes the optimised lookup's native expectations runs
# divvun-fst itself, as divvunspell does, rather than through hfst-embed, so
# the expectations do not come from the code they check.
divvun-fst = { workspace = true }
# The example's test builds its transducer with the library's compiler, which
# builds on the tropical backend. Examples run natively, so none of it reaches
# the module.
hfst-openfst = { workspace = true }
# The glue's tests compile the transducers they read with the compile
# feature. Its features reach only test builds, never the module.
hfst-embed = { workspace = true, features = ["compile"] }
# The example that writes the optimised lookup's native expectations for the
# JavaScript parity suite reads its request and writes its answer as JSON, and
# the version test reads js/hfst/package.json.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The example's test checks the native expectations the JavaScript parity
# suite compares the optimised lookup with, so it runs with the crate's tests.
[[example]]
name = "js_optimised_expected"
test = true

[lints]
workspace = true
