# Greenlandic. Every pattern matches a tag on the analysis side of lang-kal's
# src/fst/generator-gt-norm.hfst.

# A derivation ends with its Der tag, as +NIQ+Der/vn does.
boundary = ["+Der/*"]

# The demonstrative prefixes, as in TA+una.
prefix = ["TA+", "AA+"]

# The derivational morphemes, from Oqaasileriffik's list of 462 morpheme
# names, less the 91 the generator lacks. The generator writes a Der tag
# after each or leaves it out, so a derivation tag only begins a unit, which
# its Der tag ends, and a chain of morpheme names is no unit.
