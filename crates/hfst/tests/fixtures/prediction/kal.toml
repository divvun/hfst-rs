# Oqaasileriffik's enclitics. Its list also has +MITA and +MITAAVA, which
# the generator lacks. +LI, +MI, +KASIK, +PALAAQ and +QQINNAAQ are
# derivation tags too: after a stem they begin a derivation, which a Der tag
# ends, and after a complete word an enclitic.
enclitic = [
    "+AA", "+AASIIT", "+AASIT", "+GUUQ", "+KASIK", "+LI", "+LU", "+LUUNNIIT",
    "+LUSUUQ", "+MAA", "+MAANNA", "+MAANNAA", "+MI", "+PALAAQ", "+QQINNAAQ",
    "+TTAAQ", "+UKU", "+UKUA", "+UNA",
]

# Transitivity and other grammatical marks, and semantic tags. The generator
# accepts most words with or without them, so they are not a choice.
hidden = ["+Gram/*", "+Sem/*"]

[[class]]
name = "noun"
patterns = ["+Der/vn", "+Der/nn", "+N"]

[[class]]
name = "verb"
patterns = ["+Der/nv", "+Der/vv", "+V"]
