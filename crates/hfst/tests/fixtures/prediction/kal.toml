# Greenlandic. Every pattern matches a tag on the analysis side of lang-kal's
# src/fst/generator-gt-norm.hfst.

# A derivation ends with its Der tag, as +NIQ+Der/vn does.
boundary = ["+Der/*"]

# The demonstrative prefixes, as in TA+una.
prefix = ["TA+", "AA+"]

# The derivational morphemes: the 371 of Oqaasileriffik's 462 morpheme
# names the generator has, and the 31 more that the tilhæng list in
# src/fst/morphology/root.lexc names, the generator has, and the lexicon
# writes before a Der tag somewhere. The tilhæng it writes only as clitics
# or particles are left out. The generator writes a Der tag after each or
# leaves it out, so a run holds at most one of them and a boundary tag must
# end it, and a chain of morpheme names is no unit.
