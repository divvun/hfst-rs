[package]
name = "hfst"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
hfst-openfst = { workspace = true }
glob = "0.3"
icu = "2.2.0"
smallvec = "1"
smol_str = { version = "0.3", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nfst-xre = { workspace = true }
nfst-lexc = { workspace = true }
nfst-pmatch = { workspace = true }
nfst-twolc = { workspace = true }
nfst-xfst = { workspace = true }
foma = { version = "0.5.2", optional = true }
thiserror = "2.0.18"
tracing = "0.1.44"
ariadne = "0.5"
web-time = "1"
sha2 = { version = "0.11.1", default-features = false }
toml = { version = "1.2.1", default-features = false, features = ["std", "serde", "parse"] }

# BHFST packing (tools::bhfst), through box-format's sans-I/O archive reader
# and writer. Its light `std` feature carries them with no tokio, memory maps
# or blake3, so it builds for wasm32-unknown-unknown. The archives it writes
# are byte for byte those of the revision divvunspell pins (its Cargo.lock:
# git+https://github.com/bbqsrc/box rev
# 3d3818ce6251201916f2ce99a2aedfef321ba3ad), so divvunspell reads them.
# Members are stored uncompressed, so no compression feature is needed.
box-format = { git = "https://github.com/bbqsrc/box", rev = "2333d401b1d06ef6c3aca9f32b0c33efd4b8b1b4", default-features = false, features = ["std"], optional = true }
serde-xml-rs = { version = "=0.6.0", default-features = false, optional = true }
# Reading zhfst speller archives, with the version divvunspell reads them
# with. Only deflate is needed (Giella zhfst members are deflated), taken
# through flate2's zlib-rs backend rather than zip's default `deflate`, which
# would also bring in zopfli for writing.
zip = { version = "9.2", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }

# tests/path_extraction_linear.rs counts the bytes a walk allocates and holds.
[dev-dependencies]
allocation-counter = "0.8"

[features]
default = ["foma", "bhfst"]
foma = ["dep:foma"]
bhfst = ["dep:box-format", "dep:serde-xml-rs", "dep:zip"]

[lints]
workspace = true
