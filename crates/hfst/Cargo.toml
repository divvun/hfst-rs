[package]
name = "hfst"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
hfst-openfst = { workspace = true }
glob = "0.3"
icu = "2.2.0"
smallvec = "1"
smol_str = { version = "0.3", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nfst-xre = { workspace = true }
nfst-lexc = { workspace = true }
nfst-pmatch = { workspace = true }
nfst-twolc = { workspace = true }
nfst-xfst = { workspace = true }
foma = { git = "https://github.com/divvun/foma-rs", rev = "51aaf5ea546ee2c3d20dd94b4855683d5e09c5e9", optional = true }
thiserror = "2.0.18"
tracing = "0.1.44"
ariadne = "0.5"

[features]
default = ["foma"]
foma = ["dep:foma"]

[lints]
workspace = true
