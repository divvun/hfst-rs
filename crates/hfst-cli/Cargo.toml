[package]
name = "hfst-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The HFST command-line tools (tools/src/*.cc), ported faithfully (getopt and
# all). Shared infra (hfst-getopt, hfst-commandline, hfst-program-options,
# hfst-tool-metadata) lives in the library; each hfst-<verb> tool is a module
# under src/tools/, and the single 'hfst' multiplexer binary dispatches to
# them by invoked basename (symlink named hfst-<verb>) or subcommand.
[features]
default = ["foma"]
foma = ["hfst/foma"]
# Heap-profiling build: swaps mimalloc for dhat's allocator and brackets the
# tool run with a dhat profiler (writes dhat-heap.json). Not for release use.
dhat-heap = ["dep:dhat"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
hfst = { workspace = true }
hfst-openfst = { workspace = true }
mimalloc = { version = "0.1", default-features = false }
dhat = { version = "0.3", optional = true }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
sysinfo = { version = "0.37.2", default-features = false, features = ["system"] }

# BHFST packing (hfst-bhfst). box-format is pinned to the exact git rev
# divvunspell pins (its Cargo.lock: git+https://github.com/bbqsrc/box
# rev 3d3818ce6251201916f2ce99a2aedfef321ba3ad), so the archives rust-hfst
# emits are byte-compatible with what divvunspell consumes. The `reader`
# feature is pulled in for `hfst-bhfst -I` (metadata inspection); `writer`
# transitively enables it, but we name it explicitly for clarity.
box-format = { git = "https://github.com/bbqsrc/box", rev = "3d3818ce6251201916f2ce99a2aedfef321ba3ad", default-features = false, features = ["writer", "reader"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-xml-rs = { version = "=0.6.0", default-features = false }
tempfile = "3"

# Reading zhfst speller archives (hfst-bhfst --zhfst). Same major version
# divvunspell reads them with. Only deflate is needed (Giella zhfst members are
# deflated), and it is taken through flate2's zlib-rs backend — the one already
# in the tree — rather than zip's default `deflate`, which would also drag in
# zopfli purely for writing. Naming the backend explicitly (not the bare
# `deflate-flate2`) is what keeps flate2 compiling under
# `--no-default-features`, where nothing else selects one for it.
zip = { version = "6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
