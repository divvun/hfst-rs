[package]
name = "hfst-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

# The HFST command-line tools (tools/src/*.cc), ported faithfully (getopt and
# all). Shared infra (hfst-getopt, hfst-commandline, hfst-program-options,
# hfst-tool-metadata) lives in the library; each hfst-<verb> tool is a [[bin]]
# added as it is ported.
[dependencies]
hfst = { workspace = true }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
