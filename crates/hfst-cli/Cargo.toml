[package]
name = "hfst-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The HFST command-line tools (tools/src/*.cc), ported faithfully (getopt and
# all). Shared infra (hfst-getopt, hfst-commandline, hfst-program-options,
# hfst-tool-metadata) lives in the library; each hfst-<verb> tool is a module
# under src/tools/, and the single 'hfst' multiplexer binary dispatches to
# them by invoked basename (symlink named hfst-<verb>) or subcommand.
[features]
# HAVE_FOMA: compile the native foma backend into the CLI. The FOMA_TYPE arms
# in the tools are always present but runtime-guarded by
# is_implementation_type_available(FOMA_TYPE), which this feature flips on.
foma = ["hfst/foma"]

[dependencies]
clap = "4.6.1"
hfst = { workspace = true }
hfst-openfst = { workspace = true }
mimalloc = { version = "0.1", default-features = false }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[lints]
workspace = true
