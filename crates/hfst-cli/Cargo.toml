[package]
name = "hfst-cli"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true

# The HFST command-line tools (tools/src/*.cc), ported faithfully (getopt and
# all). Shared infra (hfst-getopt, hfst-commandline, hfst-program-options,
# hfst-tool-metadata) lives in the library; each hfst-<verb> tool is a module
# under src/tools/, and the single 'hfst' multiplexer binary dispatches to
# them by invoked basename (symlink named hfst-<verb>) or subcommand.
[features]
default = ["foma"]
foma = ["hfst/foma"]
# Heap-profiling build: swaps mimalloc for dhat's allocator and brackets the
# tool run with a dhat profiler (writes dhat-heap.json). Not for release use.
dhat-heap = ["dep:dhat"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
hfst = { workspace = true, features = ["bhfst"] }
hfst-openfst = { workspace = true }
mimalloc = { version = "0.1", default-features = false }
dhat = { version = "0.3", optional = true }
# The xfst shell's line editor. No file history: the history lasts for the
# session only.
rustyline = { version = "19", default-features = false }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
sysinfo = { version = "0.37.2", default-features = false, features = ["system"] }

# The tests open the archives hfst-bhfst writes with box-format's own reader,
# and build zhfst inputs with zip, at the versions the library packs with.
[dev-dependencies]
box-format = { git = "https://github.com/bbqsrc/box", rev = "3d3818ce6251201916f2ce99a2aedfef321ba3ad", default-features = false, features = ["writer", "reader"] }
serde_json = "1"
tempfile = "3"
zip = { version = "9.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Ctrl-C in the interactive xfst shell sets the session's interrupt flag.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"

# Drives the xfst shell through a pseudo-terminal, where the line editor runs.
[target.'cfg(unix)'.dev-dependencies]
rexpect = "0.7"

[lints]
workspace = true
